<rect x="240" y="372" width="736" height="160" rx="14" fill="#faf7fd" stroke="#e4d9f2"/>
<rect x="264" y="394" width="58" height="22" rx="11" fill="#ede4fa"/>
<text x="293" y="409" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="middle">第二章</text>
<rect x="330" y="394" width="110" height="22" rx="11" fill="#fff" stroke="#e5e7eb"/>
<text x="385" y="409" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">煮込みの魔法使い</text>
<text x="264" y="444" font-size="13" fill="#334155">火加減というものを理解しつつある。弱火でじっくり煮込むと、食材の中から旨味が溶け出してくる。</text>
<text x="264" y="466" font-size="13" fill="#334155">鍋の中で起きる変化は、まるで魔法のよう。下ごしらえという名の詠唱をマスターせよ。</text>
<text x="264" y="496" font-size="11" fill="#64748b">次のステージまで</text>
<text x="952" y="496" font-size="11" fill="#64748b" text-anchor="end">480 XP</text>
