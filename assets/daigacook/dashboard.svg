<text x="332" y="162" font-size="17" font-weight="700" fill="#0f172a">フードクリエイター</text>
<text x="332" y="180" font-size="11" fill="#64748b">次：伝説のシェフ</text>
<text x="264" y="204" font-size="12" fill="#64748b">経験値</text>
